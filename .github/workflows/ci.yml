name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          tool_name: eslint-node-24
          eslint_flags: "."
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get git diff
        id: get_diff
        run: |
          # ターゲットブランチ（mainやdevelopなど）との差分を取得
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

          # 差分を環境変数に安全にエスケープして保存（複数行対応）
          echo "PR_DIFF<<EOF" >> $GITHUB_ENV
          cat diff.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        shell: bash

      - name: OpenRouter AI Review
        id: ai_response
        uses: fjogeleit/http-request-action@v2
        with:
          url: 'https://openrouter.ai/api/v1/chat/completions'
          method: 'POST'
          customHeaders: '{"Authorization": "Bearer ${{ secrets.OPENROUTER_API_KEY }}"}'
          data: >
            {
              "model": "openai/gpt-oss-120b:free",
              "messages": [
                {
                  "role": "system",
                  "content": "あなたは優秀なシニアエンジニアです。提供されたGitの差分コード（diff）を日本語でレビューし、バグの可能性、可読性の改善点、セキュリティ上の懸念があれば、指摘箇所を明確にしてプルリクエストのコメント形式でアドバイスしてください。特に問題がなければ褒めてください。"
                },
                {
                  "role": "user",
                  "content": ${{ toJson(env.PR_DIFF) }}
                }
              ]
            }

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 🤖 AI Code Review 結果

            ${{ fromJson(steps.ai_response.outputs.response).choices[0].message.content }}
